[package]
name = "surge-core"
version = "1.4.0"
edition = "2024"

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
log = "0.4.28"
nalgebra = "0.34.1"
png = "0.18.0"
skrifa = "=0.50.0"
surge-sdk = { path = "../surge-sdk" }
thiserror = "2.0.17"
vk-mem = "0.5.0"
winit = "0.30.12"

[features]
default = ["validation_layers"]
validation_layers =[]

# harfrust (shaping) and zeno (coverage) remain dev-dependencies for the Step 0
# throwaway spike (tests/font_spike.rs). skrifa is now a real dependency: the
# player-side font_database parses one skrifa font per file to draw glyph outlines.
# zeno moves to a real dependency in Step 5 (rasterization).
[dev-dependencies]
harfrust = "=0.16.1"
zeno = "=0.3.3"
