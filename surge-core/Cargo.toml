[package]
name = "surge-core"
version = "1.4.0"
edition = "2024"

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
log = "0.4.28"
nalgebra = "0.34.1"
png = "0.18.0"
surge-sdk = { path = "../surge-sdk" }
thiserror = "2.0.17"
vk-mem = "0.5.0"
winit = "0.30.12"

[features]
default = ["validation_layers"]
validation_layers =[]

# Step 0 dependency spike (throwaway): proves harfrust (shaping) + skrifa (outlines)
# + zeno (coverage) before any GPU wiring. These move to their real homes in later
# steps (harfrust -> surge-sdk, skrifa + zeno -> surge-core deps).
[dev-dependencies]
harfrust = "=0.16.1"
skrifa = "=0.50.0"
zeno = "=0.3.3"
