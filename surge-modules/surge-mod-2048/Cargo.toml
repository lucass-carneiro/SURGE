[package]
name = "surge-mod-2048"
version = "1.4.0"
edition = "2024"

[dependencies]
log = "0.4.28"
rand = "0.9.2"
surge-player = { path = "../../surge-player", optional = true }
surge-sdk = { path = "../../surge-sdk" }

[features]
release-bin = ["dep:surge-player"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "surge_mod_2048"
path = "src/bin/dev.rs"

[[bin]]
name = "surge_mod_2048_release"
path = "src/bin/release.rs"
required-features = ["release-bin"]
