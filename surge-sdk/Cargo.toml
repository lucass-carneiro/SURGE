[package]
name = "surge-sdk"
version = "1.4.0"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
log = "0.4.28"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.8"
winit = { version = "0.30.12", features = ["serde"] }
